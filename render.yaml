# Render blueprint — ONE service serving both the API and the web app.
# Single origin means no CORS, one custom domain, one TLS certificate.
#
# In Render: New + → Blueprint → pick this repo → Apply.
# MONGODB_URI is a secret, so it is entered in the dashboard, not stored here.

services:
  - type: web
    name: tutwithus-dashboard
    runtime: node
    plan: free
    region: oregon
    rootDir: backend

    # The backend has no build step of its own. This installs the API's
    # dependencies, then builds the React app into frontend/dist, which
    # Express serves. --include=dev is required because Render sets
    # NODE_ENV=production, and vite/tailwind are devDependencies.
    buildCommand: npm ci && cd ../frontend && npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # Atlas string including the /tw_dash database and its options.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Used only by `npm run seed`; change before seeding a new environment.
      - key: SEED_ADMIN_EMAIL
        value: admin@tutwithus.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: TutWithUs Admin
      # CLIENT_ORIGIN is not needed: the app and API share one origin.
