# Render blueprint — deploys the API and the web app together.
# In Render: New + → Blueprint → pick this repo → Apply.
# Set MONGODB_URI when prompted (it is a secret, so it is not stored here).

services:
  # ---------------------------------------------------------------- API ---
  - type: web
    name: tutwithus-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your Atlas string, including the /tw_dash database and options.
      - key: MONGODB_URI
        sync: false
      # Generated once by Render and kept secret; never commit a real secret.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Locks CORS to the static site below — resolved automatically.
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: tutwithus-web
          property: host
      # Seed credentials, used only by `npm run seed`. Change before seeding.
      - key: SEED_ADMIN_EMAIL
        value: admin@tutwithus.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: TutWithUs Admin

  # ------------------------------------------------------------ web app ---
  - type: web
    name: tutwithus-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked in at build time — resolved automatically from the API service.
      - key: VITE_API_URL
        fromService:
          type: web
          name: tutwithus-api
          property: host
    routes:
      # Single-page app: every path must fall through to index.html,
      # otherwise a refresh on /pipeline returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
